<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e222d"/>
      <stop offset="100%" stop-color="#0c0f15"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#3b82f6" flood-opacity="0.38"/>
    </filter>
    <filter id="greenGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#10b981" flood-opacity="0.6"/>
    </filter>
  </defs>
  <!-- Squircle Base -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.14)" stroke-width="2"/>
  <rect x="6" y="6" width="116" height="116" rx="26" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  
  <!-- T Body -->
  <g filter="url(#glow)">
    <path d="M 28 32 C 28 29.8 29.8 28 32 28 L 96 28 C 98.2 28 100 29.8 100 32 L 100 44 C 100 46.2 98.2 48 96 48 L 74 48 L 74 96 C 74 98.2 72.2 100 70 100 L 58 100 C 55.8 100 54 98.2 54 96 L 54 48 L 32 48 C 29.8 48 28 46.2 28 44 Z" fill="url(#blueGrad)" />
    <!-- Terminal Prompt Chevron > accent inside T -->
    <path d="M 37 34 L 43 38 L 37 42" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>
  </g>
  
  <!-- Terminal Green Blinking Cursor Block on bottom right of the stem -->
  <rect x="76" y="86" width="22" height="14" rx="3.5" fill="url(#greenGrad)" filter="url(#greenGlow)" />
</svg>